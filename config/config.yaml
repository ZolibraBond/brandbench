# BrandBench Configuration

# OpenAI API Configuration
openai:
  api_key: ${OPENAI_API_KEY}  # Set via environment variable
  model: gpt-4.1
  temperature: 0.7

# Brand Configuration
brands:
  target_brand: "Bond"
  all_brands:
    - "Bond"
    - "Somfy TaHoma"
    - "Rollease Pulse"
    - "Lutron"
    - "Broadlink"
    - "Logitech Harmony"
    - "SwitchBot"
    - "Aqara"
    - "RYSE"
    - "Zigbee"
    - "Z-Wave"
    - "Matter"

# Evaluation Settings
evaluation:
  sentiment_model: gpt-4.1
  sentiment_temperature: 0.3
  batch_size: 10
